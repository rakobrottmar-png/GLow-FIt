name: Website

on:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Seite nur Training erzeugen
        run: |
          sed -e 's|<title>Glow Up</title>|<title>Glow Up Training</title>|'               -e 's|<body>|<body class="only"><script>window.GLOW_ONLY="training"</script>|'               www/index.html > www/training.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
