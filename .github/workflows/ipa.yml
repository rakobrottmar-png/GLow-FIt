name: IPA bauen

# Baut bei jedem Push auf main eine unsignierte IPA und haengt sie an ein Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    # Intel-Runner: die arm64-Macs von GitHub sind oft ueberlastet und nehmen den Job nicht an.
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Web-App ins iOS-Projekt kopieren
        run: npx cap sync ios

      - name: App bauen (ohne Signatur)
        working-directory: ios/App
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -list
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -n 40

      - name: IPA packen
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry GlowUp.ipa Payload
          ls -lh GlowUp.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GlowUp-ipa
          path: GlowUp.ipa

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" GlowUp.ipa --title "Glow Up $TAG" \
            --notes "Unsignierte IPA. Installation z. B. mit Sideloadly oder AltStore (siehe README)."
